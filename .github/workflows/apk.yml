name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk RodaPartes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RodaPartes-apk
          path: RodaPartes.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: RodaPartes APK
          files: RodaPartes.apk
