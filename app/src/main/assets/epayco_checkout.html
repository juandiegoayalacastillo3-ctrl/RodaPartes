<!DOCTYPE html>
<!--
    Checkout de ePayco (RF-PAG-03). La app reemplaza los valores {{...}} antes de cargar la página.
    El script oficial de ePayco abre el formulario de pago; al terminar, ePayco redirige a
    {{RESPONSE_URL}}?ref_payco=... y la app intercepta esa URL para validar la transacción.
-->
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin: 0; font-family: sans-serif; background: #F2F3F5; color: #1F2330;
               display: flex; align-items: center; justify-content: center; height: 100vh; }
        p { text-align: center; padding: 24px; }
    </style>
    <script src="https://checkout.epayco.co/checkout.js"></script>
</head>
<body>
<p id="msg">Abriendo ePayco…</p>
<script>
    function openCheckout() {
        try {
            var handler = ePayco.checkout.configure({
                key: "{{PUBLIC_KEY}}",
                test: {{TEST}}
            });
            handler.open({
                name: "RodaPartes",
                description: "{{DESCRIPTION}}",
                invoice: "{{INVOICE}}",
                currency: "cop",
                amount: "{{AMOUNT}}",
                tax_base: "0",
                tax: "0",
                country: "co",
                lang: "es",
                external: "false",
                response: "{{RESPONSE_URL}}",
                name_billing: "{{NAME}}",
                email_billing: "{{EMAIL}}",
                mobilephone_billing: "{{PHONE}}",
                address_billing: "{{ADDRESS}}"
            });
            document.getElementById("msg").innerText = "Completa el pago en la ventana de ePayco.";
        } catch (e) {
            document.getElementById("msg").innerText = "No se pudo abrir ePayco: " + e.message;
            if (window.RodaPartes) window.RodaPartes.onError(String(e.message));
        }
    }
    if (window.ePayco) openCheckout();
    else window.addEventListener("load", openCheckout);
</script>
</body>
</html>
